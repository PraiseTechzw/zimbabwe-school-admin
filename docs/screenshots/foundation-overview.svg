  <rect x="72" y="458" width="1296" height="64" rx="16" fill="white" stroke="#dbe3ea"/><text x="104" y="498" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f3049">Foundation modules</text><text x="350" y="498" font-family="Arial, sans-serif" font-size="15" fill="#617285">Academic structure</text><text x="585" y="498" font-family="Arial, sans-serif" font-size="15" fill="#617285">People &amp; access</text><text x="810" y="498" font-family="Arial, sans-serif" font-size="15" fill="#617285">Operations</text>
