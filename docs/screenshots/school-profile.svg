  <rect x="879" y="382" width="489" height="170" rx="18" fill="#eef3f6"/>
  <text x="913" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#718193">BRAND PRESENCE</text>
