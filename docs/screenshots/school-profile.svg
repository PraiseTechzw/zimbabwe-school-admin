  <rect x="1083" y="506" width="64" height="50" rx="12" fill="#0f3049"/><path d="M1098 537h34M1105 524h20" stroke="#d6a94b" stroke-width="5" stroke-linecap="round"/>
  <text x="913" y="625" font-family="Arial, sans-serif" font-size="13" fill="#596b7c">PRIMARY COLOUR</text><text x="1177" y="625" font-family="Arial, sans-serif" font-size="13" fill="#596b7c">ACCENT</text>
  <rect x="913" y="640" width="210" height="45" rx="10" fill="#f8fafc" stroke="#d8e1e8"/><rect x="1177" y="640" width="155" height="45" rx="10" fill="#f8fafc" stroke="#d8e1e8"/>
  <rect x="928" y="653" width="20" height="20" rx="5" fill="#123b5d"/><text x="958" y="669" font-family="Arial, sans-serif" font-size="14" fill="#1e3448">#123B5D</text>
  <rect x="1192" y="653" width="20" height="20" rx="5" fill="#c99a3e"/><text x="1222" y="669" font-family="Arial, sans-serif" font-size="14" fill="#1e3448">#C99A3E</text>
  <rect x="913" y="722" width="419" height="48" rx="12" fill="#ecfdf5" stroke="#b7ead2"/><text x="937" y="751" font-family="Arial, sans-serif" font-size="13" fill="#087443">Logo files are stored securely outside the database.</text>
