<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Zimbabwe School Admin school profile screen</title>
  <desc id="desc">A navy and gold administrative dashboard showing official school details and brand presence.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1"><stop offset="0" stop-color="#0f3049"/><stop offset="1" stop-color="#173f5d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f2c46" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1440" height="860" fill="#f6f8fb"/>
  <rect width="1440" height="255" fill="url(#hero)"/>
  <circle cx="1270" cy="40" r="220" fill="#d6a94b" opacity=".10"/>
  <text x="72" y="62" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#e4c477">STAGE 1 · SCHOOL FOUNDATION</text>
  <text x="72" y="122" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">A considered foundation for</text>
  <text x="72" y="169" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">confident school administration.</text>
  <text x="72" y="209" font-family="Arial, sans-serif" font-size="17" fill="#c9dbe8">Set up identity, academic structure, people, spaces and permissions.</text>
  <rect x="1106" y="105" width="255" height="80" rx="18" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="1130" y="136" font-family="Arial, sans-serif" font-size="13" fill="#c9dbe8">CONFIGURATION READINESS</text>
  <text x="1130" y="166" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="white">5/5 foundations ready</text>
  <rect x="72" y="286" width="1296" height="64" rx="16" fill="white" stroke="#dbe3ea"/>
  <text x="101" y="326" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f3049">School profile</text>
  <text x="267" y="326" font-family="Arial, sans-serif" font-size="16" fill="#617285">Academic structure</text>
  <text x="478" y="326" font-family="Arial, sans-serif" font-size="16" fill="#617285">People &amp; access</text>
  <text x="674" y="326" font-family="Arial, sans-serif" font-size="16" fill="#617285">Operations</text>
