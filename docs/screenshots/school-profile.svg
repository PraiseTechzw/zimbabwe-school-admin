    <rect x="104" y="634" width="700" height="48" rx="10"/><rect x="104" y="717" width="700" height="48" rx="10"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#1e3448">
    <text x="122" y="580">Mufakose High School</text><text x="504" y="580">MPS-2026-0142</text>
    <text x="122" y="664">Knowledge, character, service</text><text x="122" y="747">12 School Road, Mufakose</text>
  </g>
