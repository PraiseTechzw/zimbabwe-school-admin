  <text x="104" y="462" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#15293b">Official school details</text>
  <text x="104" y="490" font-family="Arial, sans-serif" font-size="15" fill="#718193">Secondary-school registration and contact information.</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#596b7c">
    <text x="104" y="538">SCHOOL NAME</text><text x="486" y="538">MoPSE REGISTRATION NUMBER</text>
    <text x="104" y="622">SCHOOL MOTTO</text><text x="104" y="705">ADDRESS LINE 1</text>
  </g>
